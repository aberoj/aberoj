<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6feb">
<title>Table Viewer</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #5d6673;
    --line: #dde1e6; --accent: #1f6feb; --err: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --card: #1a1f26; --text: #e6e9ed; --muted: #9aa4b1; --line: #2c333d; --accent: #5b9bff; --err: #ff7b72; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 1; background: var(--bg); padding: 12px 16px 8px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
  .row { display: flex; gap: 8px; margin-top: 8px; }
  input, select, button { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
  input[type=search] { width: 100%; }
  select { flex: 1; min-width: 0; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; }
  .icon { padding: 6px 10px; min-height: 36px; font-size: 14px; }
  main { padding: 12px 16px 80px; max-width: 900px; margin: 0 auto; }
  .status { color: var(--muted); font-size: 14px; margin: 4px 0 12px; }
  .error { color: var(--err); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
  .card dl { margin: 0; display: grid; grid-template-columns: minmax(90px, 35%) 1fr; gap: 4px 12px; }
  .card dt { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .card dd { margin: 0; overflow-wrap: anywhere; }
  .card.collapsed dl > :nth-child(n+9) { display: none; }
  .more { margin-top: 6px; font-size: 14px; color: var(--accent); background: none; border: 0; padding: 4px 0; min-height: 0; }
  .null { color: var(--muted); font-style: italic; }
  footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 8px; justify-content: space-between; align-items: center; }
  footer span { color: var(--muted); font-size: 14px; }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--text); width: min(420px, calc(100% - 32px)); }
  dialog input { width: 100%; margin: 8px 0 12px; }
</style>
</head>
<body>
<header>
  <h1><span id="title">Table Viewer</span><button class="icon" id="settingsBtn" aria-label="Settings">⚙︎ Key</button></h1>
  <form id="searchForm" role="search">
    <input type="search" id="search" placeholder="Search…" autocomplete="off" enterkeyhint="search">
  </form>
  <div class="row">
    <select id="sort" aria-label="Sort by"></select>
    <button id="order" aria-label="Sort direction">▲ Asc</button>
  </div>
</header>

<main>
  <p class="status" id="status">Loading…</p>
  <div id="results"></div>
</main>

<footer>
  <button id="prev" disabled>‹ Prev</button>
  <span id="pageInfo"></span>
  <button id="next" class="primary" disabled>Next ›</button>
</footer>

<dialog id="settings">
  <form method="dialog">
    <label for="apiKey"><strong>API key</strong></label>
    <input id="apiKey" type="password" autocomplete="off" placeholder="Same value as API_KEY in .env">
    <div class="row" style="justify-content:flex-end">
      <button value="cancel">Cancel</button>
      <button value="save" class="primary">Save</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  const PAGE = 25;
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const state = { offset: 0, total: 0, order: 'asc', columns: [] };

  async function api(path) {
    const res = await fetch(path, { headers: { 'X-API-Key': store.get('apiKey') } });
    const body = await res.json().catch(() => ({}));
    if (res.status === 401) { openSettings(); }
    if (!res.ok) throw new Error(body.error || `HTTP ${res.status}`);
    return body;
  }

  function showError(msg) {
    $('status').innerHTML = '';
    const span = document.createElement('span');
    span.className = 'error';
    span.textContent = msg;
    $('status').appendChild(span);
  }

  function formatValue(v) {
    if (v === null || v === undefined) return null;
    if (typeof v === 'boolean') return v ? 'Yes' : 'No';
    if (typeof v === 'string' && /^\d{4}-\d\d-\d\dT\d\d:\d\d/.test(v)) {
      const d = new Date(v);
      if (!isNaN(d)) return v.endsWith('T00:00:00.000Z') ? d.toLocaleDateString(undefined, { timeZone: 'UTC' }) : d.toLocaleString();
    }
    return String(v);
  }

  function render(rows) {
    const box = $('results');
    box.replaceChildren();
    for (const row of rows) {
      const card = document.createElement('div');
      card.className = 'card';
      const dl = document.createElement('dl');
      const keys = Object.keys(row);
      for (const k of keys) {
        const dt = document.createElement('dt');
        dt.textContent = k;
        const dd = document.createElement('dd');
        const val = formatValue(row[k]);
        if (val === null) { dd.textContent = 'empty'; dd.className = 'null'; } else { dd.textContent = val; }
        dl.append(dt, dd);
      }
      card.appendChild(dl);
      if (keys.length > 4) {
        card.classList.add('collapsed');
        const more = document.createElement('button');
        more.className = 'more';
        more.textContent = `Show all ${keys.length} fields`;
        more.onclick = () => {
          const c = card.classList.toggle('collapsed');
          more.textContent = c ? `Show all ${keys.length} fields` : 'Show less';
        };
        card.appendChild(more);
      }
      box.appendChild(card);
    }
  }

  async function load() {
    $('status').textContent = 'Loading…';
    const params = new URLSearchParams({ limit: PAGE, offset: state.offset, order: state.order });
    if ($('sort').value) params.set('sort', $('sort').value);
    const q = $('search').value.trim();
    if (q) params.set('search', q);
    try {
      const data = await api('/api/rows?' + params);
      state.total = data.total;
      render(data.rows);
      const from = data.total ? data.offset + 1 : 0;
      const to = data.offset + data.rows.length;
      $('status').textContent = data.total ? `${data.total.toLocaleString()} record(s)` : 'No records found';
      $('pageInfo').textContent = data.total ? `${from}–${to} of ${data.total.toLocaleString()}` : '';
      $('prev').disabled = data.offset === 0;
      $('next').disabled = to >= data.total;
    } catch (e) {
      showError(e.message);
      $('results').replaceChildren();
    }
  }

  async function init() {
    try {
      const meta = await api('/api/columns');
      state.columns = meta.columns;
      $('title').textContent = meta.table;
      document.title = meta.table;
      const sel = $('sort');
      sel.replaceChildren();
      for (const c of meta.columns) {
        const o = document.createElement('option');
        o.value = c.name;
        o.textContent = 'Sort: ' + c.name;
        sel.appendChild(o);
      }
      if (meta.idColumn) sel.value = meta.idColumn;
      await load();
    } catch (e) {
      showError(e.message);
    }
  }

  function openSettings() {
    $('apiKey').value = store.get('apiKey');
    if (!$('settings').open) $('settings').showModal();
  }

  $('settings').addEventListener('close', () => {
    if ($('settings').returnValue === 'save') {
      store.set('apiKey', $('apiKey').value.trim());
      init();
    }
  });
  $('settingsBtn').onclick = openSettings;
  $('searchForm').onsubmit = (e) => { e.preventDefault(); $('search').blur(); state.offset = 0; load(); };
  $('search').addEventListener('search', () => { if (!$('search').value) { state.offset = 0; load(); } });
  $('sort').onchange = () => { state.offset = 0; load(); };
  $('order').onclick = () => {
    state.order = state.order === 'asc' ? 'desc' : 'asc';
    $('order').textContent = state.order === 'asc' ? '▲ Asc' : '▼ Desc';
    state.offset = 0; load();
  };
  $('prev').onclick = () => { state.offset = Math.max(0, state.offset - PAGE); load(); scrollTo(0, 0); };
  $('next').onclick = () => { state.offset += PAGE; load(); scrollTo(0, 0); };

  init();
})();
</script>
</body>
</html>
